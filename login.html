
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход в аккаунт — АвтоГид</title>

  <style>
    :root {
      font-family: Inter, Arial, sans-serif;
      color: #172b4d;
      background: #f3f7fc;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body { margin: 0; min-height: 100vh; }

    .header {
      background: #fff;
      border-bottom: 1px solid #e6ecf4;
      padding: 20px max(24px, calc((100% - 1160px) / 2));
    }

    .logo {
      color: #1769db;
      font-size: 25px;
      font-weight: 800;
      text-decoration: none;
    }

    main {
      min-height: calc(100vh - 76px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 18px;
    }

    .card {
      background: #fff;
      width: 100%;
      max-width: 455px;
      padding: 40px;
      border: 1px solid #edf1f7;
      border-radius: 22px;
      box-shadow: 0 18px 55px rgba(31, 65, 111, .09);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #1769db;
      font-weight: 800;
      margin-bottom: 30px;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      background: #e9f2ff;
      width: 43px;
      height: 43px;
      border-radius: 13px;
      font-size: 23px;
    }

    h1 {
      font-size: 29px;
      letter-spacing: -.7px;
      margin: 0 0 12px;
    }

    .description {
      font-size: 15px;
      color: #64748b;
      line-height: 1.65;
      margin: 0 0 30px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 9px;
    }

    input {
      width: 100%;
      height: 52px;
      padding: 0 15px;
      font: inherit;
      font-size: 16px;
      border: 1px solid #cfdae8;
      border-radius: 11px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    input:focus {
      border-color: #1769db;
      box-shadow: 0 0 0 4px #1769db19;
    }

    .primary {
      width: 100%;
      min-height: 50px;
      margin-top: 20px;
      background: #1769db;
      border: 0;
      border-radius: 11px;
      color: white;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary:hover { background: #105ac1; }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .secondary {
      display: block;
      margin: 18px auto 0;
      background: none;
      border: none;
      color: #1769db;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .hint {
      background: #f0f6ff;
      border-radius: 11px;
      padding: 13px;
      color: #48617f;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 23px;
    }

    .message {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.5;
    }

    .error { color: #bd3030; }
    .success { color: #15803d; }

    .footer {
      text-align: center;
      margin-top: 27px;
      padding-top: 25px;
      border-top: 1px solid #e9eef5;
      font-size: 14px;
      color: #64748b;
    }

    a { color: #1769db; text-decoration: none; }
    a:hover { text-decoration: underline; }

    [hidden] { display: none !important; }

    @media (max-width: 520px) {
      main { align-items: flex-start; padding-top: 24px; }
      .card { padding: 26px 22px; }
      h1 { font-size: 25px; }
    }
  </style>
</head>

<body>
  <header class="header">
    <a href="./index.html" class="logo">АвтоГид</a>
  </header>

  <main>
    <section class="card">
      <div class="brand">
        <span class="brand-icon">🚗</span>
        <span>АвтоГид</span>
      </div>

      <h1>С возвращением!</h1>
      <p class="description">
        Войдите в аккаунт, чтобы продолжить
        поиск своего автоинструктора.
      </p>

      <form id="email-form">
        <label for="email">Электронная почта</label>
        <input
          id="email"
          type="email"
          placeholder="example@mail.ru"
          autocomplete="email"
          maxlength="254"
          required
        />

        <button class="primary" type="submit">
          Получить код для входа
        </button>
      </form>

      <form id="code-form" hidden>
        <p class="description" id="email-hint"></p>

        <label for="code">Код подтверждения</label>
        <input
          id="code"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          placeholder="000000"
          maxlength="6"
          pattern="[0-9]{6}"
          required
        />

        <button class="primary" type="submit">
          Войти в аккаунт
        </button>

        <button
          class="secondary"
          type="button"
          id="resend-code"
          disabled
        >
          Отправить код повторно
        </button>

        <button class="secondary" type="button" id="back">
          Изменить email
        </button>
      </form>

      <div id="message" class="message" role="status" aria-live="polite"></div>

      <div class="hint">
        🔒 Мы отправим одноразовый код на вашу почту.
        Пароль для входа не требуется.
      </div>

      <div class="footer">
        Нет аккаунта?
        <a href="./register.html">Зарегистрироваться</a>
      </div>
    </section>
  </main>

  <script type="module" src="./src/login.js"></script>
</body>
</html>
